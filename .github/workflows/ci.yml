name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Cache modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - name: Run tests
        run: go test ./... -count=1 -v

      - name: Run JS unit tests
        run: node scripts/js-test.mjs

      - name: Audit event page render modules
        run: node scripts/audit-event-render.mjs

      - name: Audit stockcar stage layouts
        run: node scripts/audit-stockcar-stages.mjs

      - name: Audit stockcar data quality
        run: node scripts/audit-stockcar-data.mjs

      - name: Run stockcar data audit tests
        run: node scripts/audit-stockcar-data.test.mjs

      - name: Audit caution breakdown Free Pass rows
        run: node scripts/audit-caution-breakdown.mjs

      - name: Audit innerHTML (warn-only)
        run: node scripts/audit-innerhtml.mjs

      - name: Check data pipeline
        run: node scripts/check-data.mjs

      - name: Run go vet
        run: go vet ./...

  bench:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Standings build benchmarks
        run: go test ./internal/schedulefile/... -bench=BenchmarkBuildStandingsFromEvents -benchtime=1x -count=1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          # Prebuilt binaries are still compiled with Go 1.24; build with runner Go 1.26.
          install-mode: goinstall
